<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A2B"/>
      <stop offset="0.55" stop-color="#0B3552"/>
      <stop offset="1" stop-color="#0D5B63"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="100" x2="990" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(920 80) rotate(137) scale(360 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BFEAF3" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <g opacity="0.8">
    <circle cx="1030" cy="72" r="7" fill="#5EEAD4" filter="url(#softGlow)"/>
    <circle cx="1100" cy="230" r="5" fill="#7DD3FC" filter="url(#softGlow)"/>
    <circle cx="900" cy="295" r="4" fill="#C4B5FD" filter="url(#softGlow)"/>
    <path d="M890 98L940 68L990 98L990 158L940 188L890 158V98Z" stroke="#7DD3FC" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M995 185L1040 159L1085 185V237L1040 263L995 237V185Z" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M865 220L895 203L925 220V254L895 271L865 254V220Z" stroke="#C4B5FD" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M940 188V214M990 158L1018 174M925 237L995 211" stroke="#BFEAF3" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <rect x="84" y="72" width="8" height="216" rx="4" fill="url(#accent)"/>
  <text x="126" y="145" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="1">JIAYI YAO</text>
  <text x="128" y="198" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="1.5">RISK  •  BUSINESS  •  FINTECH ANALYTICS</text>
  <text x="128" y="246" fill="#D7EAF1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400">Turning complex data into clear, risk-aware decisions.</text>
  <text x="128" y="282" fill="#A8C7D2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" letter-spacing="0.7">PYTHON  /  SQL  /  TABLEAU  /  FINANCIAL MODELING</text>
</svg>
